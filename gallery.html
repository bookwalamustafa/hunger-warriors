<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery · Hunger Warriors</title>
  <meta name="description" content="Photos from Hunger Warriors' Sunday food drives and relief drives across Kolkata and West Bengal. #FoodForAll">
  <meta name="theme-color" content="#0F2B5B">
  <meta property="og:title" content="Gallery · Hunger Warriors">
  <meta property="og:image" content="assets/img/team-group-photo.jpg">

  <link rel="icon" href="assets/logo-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-sub">
  <!-- Content comes from content/site.json ("gallery" for highlights, "pastDrives" for the albums). -->
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header scrolled">
    <div class="container header-inner">
      <a href="index.html" class="brand" aria-label="Hunger Warriors home">
        <img src="assets/logo-mark.svg" alt="" width="38" height="44">
        <span class="brand-word"><span class="bw-1">Hunger</span><span class="bw-2">Warriors</span></span>
      </a>
      <nav class="nav" id="nav" aria-label="Main">
        <a href="index.html#about">Our story</a>
        <a href="index.html#upcoming">Upcoming</a>
        <a href="index.html#legacy">Legacy</a>
        <a href="gallery.html" aria-current="page">Gallery</a>
        <a href="index.html#involved">Volunteer</a>
        <a href="index.html#donate">Donate</a>
      </nav>
      <button class="nav-toggle" aria-controls="nav" aria-expanded="false" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main id="main">
    <section class="page-intro">
      <div class="container">
        <p class="eyebrow" data-bind="gallery.eyebrow"></p>
        <h1 data-bind-rich="gallery.heading"></h1>
        <p class="lede" data-bind="gallery.intro"></p>
      </div>
    </section>

    <section class="gallery-block">
      <div class="container">
        <h2 class="block-title" data-bind-rich="gallery.highlightsHeading"></h2>
        <div class="gallery" id="gallery-grid"></div>
      </div>
    </section>

    <section class="gallery-block">
      <div class="container">
        <h2 class="block-title" data-bind-rich="gallery.albumsHeading"></h2>
        <div id="albums"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <div>
        <div class="footer-logo">
          <img src="assets/logo-mark.svg" alt="" width="40" height="46">
          <span class="brand-word"><span class="bw-1">Hunger</span><span class="bw-2">Warriors</span></span>
        </div>
        <p data-bind="footer.blurb"></p>
      </div>
      <p class="footer-hashtag" data-bind="site.hashtag"></p>
      <p class="footer-legal">© <span id="year"></span> <span data-bind="site.name"></span> · <span data-bind="site.city"></span></p>
    </div>
  </footer>

  <div class="dock is-active" id="dock">
    <a class="dock-btn dock-join" href="index.html#upcoming" data-bind="floatingButtons.join"></a>
    <a class="dock-btn dock-donate" href="index.html#donate" data-bind="floatingButtons.donate"></a>
    <a class="dock-wa" data-wa aria-label="Chat with us on WhatsApp">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-3.2-.7-2.7-1.1-4.4-3.8-4.5-4-.1-.2-1.1-1.4-1.1-2.7s.7-1.9.9-2.2c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.7 1.2 1.6 1.9 1.1.9 2 1.2 2.3 1.4.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>
    </a>
  </div>

  <dialog class="lightbox" id="lightbox" aria-label="Photo viewer">
    <button class="lb-close" aria-label="Close">×</button>
    <button class="lb-nav lb-prev" aria-label="Previous photo">‹</button>
    <figure><img alt=""><figcaption></figcaption></figure>
    <button class="lb-nav lb-next" aria-label="Next photo">›</button>
  </dialog>

  <script src="js/main.js" defer></script>
</body>
</html>
